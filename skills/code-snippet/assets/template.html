<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ snippet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
  /* Tokens from Figma "🟢 Design System" (Colors frame 50:2823) */
  :root {
    --grey-050:#f5f5f5; --grey-100:#efefef; --grey-200:#dadada; --grey-300:#c0c0c0;
    --grey-400:#b1b1b1; --grey-500:#9d9d9d; --grey-600:#8a8a8a; --grey-700:#424242;
    --grey-800:#2b2b2b; --grey-900:#232323; --black:#191812; --shadow:#1a1912;
    --red:#d84835; --yellow:#f5c947; --pale-blue:#b5d0ed; --pale-blue-bright:#9ac8f9; --purple:#4945c8;
    --bg-primary:var(--black); --bg-secondary:var(--grey-800);
    --text-primary:var(--grey-100); --text-secondary:var(--grey-200); --text-tertiary:var(--grey-400);
    --border-secondary:var(--grey-700); --border-tertiary:var(--grey-800);
    --font-heading:"PP Neue Machina","Helvetica Neue",Arial,sans-serif;
    --font-body:"PP Neue Montreal","Helvetica Neue",Arial,sans-serif;
    --font-mono:"PP Neue Montreal Mono","SF Mono",ui-monospace,Menlo,monospace;
    --stage:var(--red);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--grey-050); color:var(--black); font-family:var(--font-body); min-height:100vh; }
  .eyebrow { font-family:var(--font-mono); font-size:12px; letter-spacing:.25em; text-transform:uppercase; }

  .layout { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
  .panel { background:var(--black); color:var(--text-primary); padding:24px; display:flex; flex-direction:column; gap:24px; border-right:1px solid var(--border-secondary); }
  .panel h1 { font-family:var(--font-heading); font-weight:400; font-size:22px; letter-spacing:-.03em; line-height:1.25; margin:0; }
  .panel .eyebrow { color:var(--text-tertiary); margin-bottom:10px; display:block; }
  .swatches { display:flex; flex-wrap:wrap; gap:8px; }
  .swatch { width:32px; height:32px; border-radius:50%; border:2px solid var(--grey-700); cursor:pointer; padding:0; }
  .swatch[aria-pressed="true"] { border-color:var(--grey-100); outline:2px solid var(--black); outline-offset:-4px; }
  .swatch:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid var(--yellow); outline-offset:2px; }
  input[type=range] { width:100%; accent-color:var(--red); }
  .row { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:12px; color:var(--text-secondary); }
  .btn { font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; background:var(--red); color:var(--grey-100); border:0; border-radius:999px; padding:14px 20px; cursor:pointer; }
  .btn:hover { background:#e25a48; }
  .btn.ghost { background:transparent; border:1px solid var(--grey-600); }
  .seg { display:flex; gap:8px; }
  .seg .btn { padding:12px 14px; flex:1; }
  .btn.ghost[aria-pressed="true"] { background:var(--grey-100); color:var(--black); border-color:var(--grey-100); }

  .preview { display:flex; align-items:center; justify-content:center; padding:32px; overflow:auto; }

  /* The exported frame */
  #frame { background:var(--stage); padding:64px; display:inline-block; min-width:min-content; }
  .window { background:var(--black); border:1px solid var(--border-secondary); border-radius:12px; box-shadow:0 24px 64px rgba(26,25,18,.45); overflow:hidden; min-width:640px; }
  .titlebar { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:14px 20px; border-bottom:1px solid var(--border-secondary); background:var(--grey-900); }
  .dots { display:flex; gap:8px; }
  .dots i { width:10px; height:10px; border-radius:50%; background:var(--grey-700); display:block; }
  .dots i:first-child { background:var(--red); }
  .file { color:var(--text-tertiary); }
  .lang { color:var(--yellow); }
  pre { margin:0; padding:24px 28px 28px; font-family:var(--font-mono); font-size:14px; line-height:1.6; color:var(--text-primary); tab-size:2; }
  .ln { display:inline-block; width:2.5ch; margin-right:2ch; text-align:right; color:var(--grey-600); user-select:none; }
  .k { color:var(--red); }          /* keywords */
  .c { color:var(--grey-500); font-style:italic; } /* comments */
  .s { color:var(--yellow); }        /* strings, symbols */
  .t { color:var(--pale-blue-bright); } /* constants / types */
  .m { color:var(--pale-blue); }     /* method calls */
  .n { color:var(--grey-200); }

  .footer { display:flex; justify-content:flex-end; margin-top:28px; min-height:44px; }
  .footer[hidden], .wm[hidden] { display:none; }
  .window { position:relative; }
  .wm { display:flex; align-items:center; gap:14px; color:var(--grey-100); }
  .wm .url { font-size:12px; opacity:.9; }
  .wm.inside { position:absolute; right:22px; bottom:20px; opacity:.45; }
  .wm.inside .mark { height:32px; }
  .wm.on-light { color:var(--black); }
  .mark { height:44px; width:auto; display:block; opacity:.9; }
  .mark.on-light { filter:brightness(0); opacity:.85; } /* Black on light stages, Grey 100 on dark ones */

  @media (max-width:820px) {
    .layout { grid-template-columns:1fr; }
    .panel { border-right:0; border-bottom:1px solid var(--border-secondary); }
    .preview { padding:16px; justify-content:flex-start; }
    #frame { padding:24px; }
    .window { min-width:0; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="panel" aria-label="Snippet controls">
    <div>
      <span class="eyebrow">Code snippet</span>
      <h1>__TITLE__</h1>
    </div>
    <div>
      <span class="eyebrow">Background</span>
      <div class="swatches" id="swatches"></div>
    </div>
    <div>
      <span class="eyebrow">Padding</span>
      <input type="range" id="pad" min="16" max="128" value="64" aria-label="Padding">
      <div class="row"><span>16</span><span id="padv">64px</span><span>128</span></div>
    </div>
    <div>
      <span class="eyebrow">Line numbers</span>
      <button class="btn ghost" id="lnbtn" type="button">Hide</button>
    </div>
    <div>
      <span class="eyebrow">Watermark</span>
      <button class="btn ghost" id="wmbtn" type="button">Hide</button>
    </div>
    <div>
      <span class="eyebrow">Watermark position</span>
      <div class="seg" role="group" aria-label="Watermark position">
        <button type="button" class="btn ghost" id="posout" aria-pressed="true">Outside</button>
        <button type="button" class="btn ghost" id="posin" aria-pressed="false">Inside</button>
      </div>
    </div>
    <button class="btn" id="export" type="button">Export PNG</button>
  </aside>

  <main class="preview">
    <div id="frame">
      <div class="window">
        <div class="titlebar">
          <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
          <span class="eyebrow file">__FILENAME__</span>
          <span class="eyebrow lang" id="langlabel"></span>
        </div>
        <pre id="code" aria-label="Code"></pre>
      </div>
      <div class="footer" id="footer"><div class="wm" id="wm"><span class="eyebrow url">__URL__</span><img class="mark" id="mark" src="__LOGO__" alt="Logomark"></div></div>
    </div>
  </main>
</div>

<script type="application/json" id="src">__CODE_JSON__</script>
<script>
const SOURCE = JSON.parse(document.getElementById("src").textContent);
const LANG = "__LANG__";

// Per-language token rules. Anything unknown falls back to "plain".
const C_LIKE = { comment: "//", kw: "const let var function return if else for while class extends import from export default new await async type interface in of throw try catch finally switch case break continue this true false null undefined".split(" ") };
const LANGS = {
  ruby: { label: "Ruby", comment: "#", symbols: true, keys: true,
    kw: "module class def self end do if elsif else unless return begin rescue ensure yield while until case when then true false nil and or not include extend require".split(" ") },
  typescript: { label: "TypeScript", ...C_LIKE },
  javascript: { label: "JavaScript", ...C_LIKE },
  python: { label: "Python", comment: "#",
    kw: "def class return if elif else for while import from as with try except finally raise pass lambda yield in not and or is None True False self".split(" ") },
  shell: { label: "Shell", comment: "#", kw: "if then else elif fi for do done while case esac function in export".split(" ") },
  json: { label: "JSON", kw: ["true", "false", "null"] },
  yaml: { label: "YAML", comment: "#", keys: true, kw: ["true", "false", "null"] },
  plain: { label: "Text", kw: [] }
};
const lang = LANGS[LANG] || { ...LANGS.plain, label: LANG.toUpperCase() };
document.getElementById("langlabel").textContent = lang.label;

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const kw = new Set(lang.kw);
const parts = [];
if (lang.comment) parts.push(["c", lang.comment.replace(/[/#]/g, "\\$&") + ".*$"]);
parts.push(["s", "\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*'|`(?:[^`\\\\]|\\\\.)*`"]);
parts.push(["s", "\\b\\d+(?:\\.\\d+)?\\b"]);
if (lang.symbols) parts.push(["s", ":[A-Za-z_]\\w*"]);
if (lang.keys) parts.push(["s", "\\b[A-Za-z_][\\w-]*:(?=\\s)"]);
parts.push(["t", "\\b[A-Z][A-Za-z0-9]*\\b"]);
parts.push(["m", "\\b[A-Za-z_]\\w*[?!]?(?=\\()"]);
parts.push(["w", "\\b[A-Za-z_]\\w*\\b"]);
const RE = new RegExp(parts.map(([, p]) => "(" + p + ")").join("|"), "g");

function highlight(line) {
  let out = "", last = 0, m;
  RE.lastIndex = 0;
  while ((m = RE.exec(line))) {
    const tok = m[0], kind = parts[m.slice(1).findIndex(Boolean)][0];
    out += esc(line.slice(last, m.index));
    if (kind === "w") out += kw.has(tok) ? `<span class="k">${esc(tok)}</span>` : `<span class="n">${esc(tok)}</span>`;
    else if (kind === "t" && kw.has(tok)) out += `<span class="k">${esc(tok)}</span>`;
    else out += `<span class="${kind}">${esc(tok)}</span>`;
    last = m.index + tok.length;
  }
  return out + esc(line.slice(last));
}

const code = document.getElementById("code");
let showLn = true;
code.innerHTML = SOURCE.replace(/\n$/, "").split("\n")
  .map((l, i) => `<span class="ln">${i + 1}</span>${highlight(l)}`).join("\n");

// Backgrounds: brand colours; the flag says whether the stage is light (watermark turns black)
const BG = [["Red","#d84835",false],["Yellow","#f5c947",true],["Pale Blue","#b5d0ed",true],["Purple","#4945c8",false],["Grey 100","#efefef",true],["Black","#191812",false]];
const mark = document.getElementById("mark"), wm = document.getElementById("wm");
let lightBg = false, inside = false;
function syncMark() {
  wm.classList.toggle("inside", inside);
  wm.classList.toggle("on-light", lightBg && !inside); // the code window is always dark
  mark.classList.toggle("on-light", lightBg && !inside);
  const host = inside ? document.querySelector(".window") : document.getElementById("footer");
  if (wm.parentElement !== host) host.appendChild(wm);
  document.getElementById("footer").hidden = inside;
}
const sw = document.getElementById("swatches");
BG.forEach(([name, hex, isLight], i) => {
  const b = document.createElement("button");
  b.className = "swatch"; b.type = "button"; b.title = name; b.setAttribute("aria-label", name);
  b.style.background = hex; b.setAttribute("aria-pressed", i === 0);
  b.onclick = () => {
    document.documentElement.style.setProperty("--stage", hex);
    lightBg = isLight; syncMark();
    sw.querySelectorAll(".swatch").forEach(x => x.setAttribute("aria-pressed", x === b));
  };
  sw.appendChild(b);
});

const frame = document.getElementById("frame");
const pad = document.getElementById("pad"), padv = document.getElementById("padv");
pad.oninput = () => { frame.style.padding = pad.value + "px"; padv.textContent = pad.value + "px"; };

const lnbtn = document.getElementById("lnbtn");
lnbtn.onclick = () => {
  showLn = !showLn;
  code.querySelectorAll(".ln").forEach(n => n.style.display = showLn ? "inline-block" : "none");
  lnbtn.textContent = showLn ? "Hide" : "Show";
};

const wmbtn = document.getElementById("wmbtn");
wmbtn.onclick = () => { wm.hidden = !wm.hidden; wmbtn.textContent = wm.hidden ? "Show" : "Hide"; };

const posout = document.getElementById("posout"), posin = document.getElementById("posin");
function setPos(toInside) {
  inside = toInside;
  posout.setAttribute("aria-pressed", !inside); posin.setAttribute("aria-pressed", inside);
  syncMark();
}
posout.onclick = () => setPos(false);
posin.onclick = () => setPos(true);

document.getElementById("export").onclick = async () => {
  try {
    const url = await htmlToImage.toPng(frame, { pixelRatio: 2 });
    const a = document.createElement("a");
    a.download = "code-snippet.png"; a.href = url; a.click();
  } catch (e) { console.error(e); alert("Export failed: " + e.message); }
};
</script>
</body>
</html>
